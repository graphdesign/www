<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 카드</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fff; }

  .card {
    position: relative; display: block; width: 100%; max-width: 480px; aspect-ratio: 16 / 9;
    padding: 0; border: 0; border-radius: 16px; overflow: hidden; cursor: pointer;
    background: #000 url(https://i.ytimg.com/vi/AWbzGozuKlo/sddefault.jpg) center / cover no-repeat;
  }
  .card::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.15); transition: background .2s; }
  .card:hover::after { background: rgba(0,0,0,.3); }
  .play {
    position: absolute; z-index: 1; top: 50%; left: 50%; width: 64px; height: auto;
    transform: translate(-50%, -50%); overflow: visible;
  }

  .modal { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; padding: 24px; background: rgba(0,0,0,.8); }
  .modal.open { display: grid; }
  .frame { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .close {
    position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.15); color: #fff; font-size: 20px; cursor: pointer;
  }
  .close:hover { background: rgba(255,255,255,.3); }
</style>
</head>
<body>
  <button class="card" id="card" type="button" aria-label="영상 재생"><svg class="play" viewBox="0 0 88 88" aria-hidden="true" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round">
      <circle cx="44" cy="44" r="42.5"/>
      <path d="M35.5 28v32l26-16z"/>
    </svg></button>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="영상">
    <button class="close" id="close" type="button" aria-label="닫기">✕</button>
    <div class="frame" id="frame"></div>
  </div>

<script>
  const VIDEO_ID = 'AWbzGozuKlo';
  const modal = document.getElementById('modal');
  const frame = document.getElementById('frame');

  function open() {
    frame.innerHTML = '<iframe src="https://www.youtube.com/embed/' + VIDEO_ID +
      '?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    modal.classList.add('open');
  }
  function close() {
    modal.classList.remove('open');
    frame.innerHTML = '';
  }

  document.getElementById('card').onclick = open;
  document.getElementById('close').onclick = close;
  modal.onclick = e => { if (e.target === modal) close(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
</script>
</body>
</html>
